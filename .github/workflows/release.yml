name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - ".github/RELEASE_TRIGGER"
      - "packaging/**"
      - "scripts/package_release.py"
      - "scripts/prepare_pix2tex.py"
      - "scripts/vendor_katex.py"
      - "pyproject.toml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Ubuntu Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install release dependencies
        run: python -m pip install -e ".[ocr,dev,build]"

      - name: Vendor offline KaTeX assets
        run: python scripts/vendor_katex.py

      - name: Prepare pix2tex checkpoints
        run: python scripts/prepare_pix2tex.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run flake8
        run: python -m flake8 src tests scripts --max-line-length=100

      - name: Build standalone app
        run: python -m PyInstaller --noconfirm --clean packaging/FormulaOCR.spec

      - name: Create release ZIP
        run: >-
          python scripts/package_release.py
          --platform "${{ matrix.platform }}"
          --version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FormulaOCR-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            subject="$(git log -1 --pretty=%s)"
            tag="${subject#release: }"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Normalize release filenames
        shell: bash
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          for file in release/FormulaOCR-main-*.zip; do
            if [[ -e "${file}" ]]; then
              mv "${file}" "${file/FormulaOCR-main-/FormulaOCR-${tag}-}"
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release_tag.outputs.tag }}"
          gh release create "${tag}" \
            release/*.zip \
            --target "${GITHUB_SHA}" \
            --title "Formula OCR ${tag}" \
            --generate-notes
