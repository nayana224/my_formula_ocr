name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install release dependencies
        run: python -m pip install -e ".[ocr,dev,build]"

      - name: Vendor offline KaTeX assets
        run: python scripts/vendor_katex.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run flake8
        run: python -m flake8 src tests scripts --max-line-length=100

      - name: Build standalone app
        run: python -m PyInstaller --noconfirm --clean packaging/FormulaOCR.spec

      - name: Create release ZIP
        run: >-
          python scripts/package_release.py
          --platform "${{ matrix.platform }}"
          --version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: FormulaOCR-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/*.zip
          --title "Formula OCR ${{ github.ref_name }}"
          --generate-notes
