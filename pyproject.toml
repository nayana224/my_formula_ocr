[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "formula-ocr"
version = "0.1.0"
description = "Cross-platform desktop app for converting equation images to LaTeX."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Formula OCR contributors"}]
dependencies = [
  "Pillow>=10,<12",
  "PySide6>=6.7,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
ocr = ["pix2tex>=0.1.4"]
dev = [
  "flake8>=7,<8",
  "pytest>=8,<9",
]

[project.scripts]
formula-ocr = "formula_ocr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
